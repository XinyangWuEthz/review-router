# Code-check layer: lint, types, unit tests, synthetic pipeline test. The
# regression gates skip here because no real report is passed in; the
# real-evaluation layer is .github/workflows/real-eval.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy review_router
      - name: Tests and regression gates
        run: pytest -q
