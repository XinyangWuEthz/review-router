name: Experiment website

on:
  push:
    branches: [main]
    paths:
      - "record/**"
      - "scripts/build_pages.py"
      - "configs/jev_questions.json"
      - "analysis/jev/protocol.json"
      - "analysis/jev/cohort.csv"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "record/**"
      - "scripts/build_pages.py"
      - "configs/jev_questions.json"
      - "analysis/jev/protocol.json"
      - "analysis/jev/cohort.csv"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage saved pages and validate local links
        run: python scripts/build_pages.py
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish experiment website
        id: deployment
        uses: actions/deploy-pages@v4
