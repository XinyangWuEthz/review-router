[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-router"
version = "0.1.0"
description = "Capacity-constrained content-policy router: expert-signal fusion, graduated enforcement tiers, and a review-queue simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xinyang Wu" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["review_router"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

# pandas is an optional extra; the type-check job installs only the core deps.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
