[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-router"
version = "0.1.0"
description = "Human-confirmed review router over a frozen classifier, with capacity-constrained queue evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xinyang Wu" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
analysis = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["review_router"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prose generator: sentences are long on purpose.
"scripts/render_results.py" = ["E501"]
# Analysis records: plotting and page templates, long lines on purpose.
"record/**" = ["E501", "E741", "B905", "B007"]

[tool.ruff.format]
# Prose generator: keep its long sentences on one line each.
exclude = ["scripts/render_results.py"]

[tool.mypy]
# python_version is left to the interpreter: numpy's stubs use 3.12 syntax.
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

# Allow ML dependencies that do not provide complete type stubs.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "scipy.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
